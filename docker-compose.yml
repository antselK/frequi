---
services:
  frequi:
    build:
      context: .
      dockerfile: "./Dockerfile"
    image: frequi
    restart: unless-stopped
    environment:
      CONTROL_PLANE_BASE_URL: ${CONTROL_PLANE_BASE_URL:-http://host.docker.internal:8000}
      # Fail fast if unset/empty — an empty token makes nginx forward a blank X-Admin-Token,
      # which the control-plane rejects with silent 401s on every request.
      CONTROL_PLANE_ADMIN_TOKEN: ${CONTROL_PLANE_ADMIN_TOKEN:?CONTROL_PLANE_ADMIN_TOKEN is required (set it in .env)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:80"
      - "100.112.155.89:3000:80"
